# ============================================================
#  Or du Temps — Déploiement automatique sur VPS
#  Secrets GitHub requis (Settings → Secrets → Actions) :
#    VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT
# ============================================================

name: 🚀 Deploy Or du Temps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement sur VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" \
            -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 💾 Backup de la version actuelle
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'if [ -d /var/www/ordutemps ]; then
               BACKUP_DIR=/var/www/ordutemps-backup-$(date +%Y%m%d-%H%M%S)
               cp -r /var/www/ordutemps "$BACKUP_DIR"
               echo "Backup créé : $BACKUP_DIR"
               ls -dt /var/www/ordutemps-backup-* 2>/dev/null | tail -n +4 | xargs rm -rf
             fi'

      - name: 📦 Déployer les fichiers (rsync)
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='devops/' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='assets/uploads/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || '22' }} -o StrictHostKeyChecking=no" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/ordutemps/"

      - name: 📦 npm ci (dépendances)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /var/www/ordutemps && npm ci --omit=dev --prefer-offline'

      - name: ♻️ Redémarrer PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /var/www/ordutemps
             if pm2 describe ordutemps > /dev/null 2>&1; then
               pm2 reload ordutemps --update-env
             else
               pm2 start server.js --name ordutemps --restart-delay=3000 --max-restarts=5
               pm2 save
             fi'

      - name: 🔄 Recharger Nginx
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo nginx -t && sudo systemctl reload nginx'

      - name: ✅ Vérification HTTP
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://ordutemps.fr" || echo "000")
          echo "Statut HTTP : $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ]; then
            echo "⚠️  Le site répond $STATUS — rollback..."
            exit 1
          fi
          echo "✅ Site en ligne"

      - name: 🔙 Rollback automatique si échec
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'LAST_BACKUP=$(ls -dt /var/www/ordutemps-backup-* 2>/dev/null | head -1)
             if [ -n "$LAST_BACKUP" ]; then
               echo "Rollback vers $LAST_BACKUP..."
               rm -rf /var/www/ordutemps
               cp -r "$LAST_BACKUP" /var/www/ordutemps
               cd /var/www/ordutemps && pm2 reload ordutemps --update-env || true
               sudo nginx -t && sudo systemctl reload nginx || true
               echo "Rollback OK"
             else
               echo "Aucun backup disponible"
             fi'

      - name: 🧹 Nettoyage SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
