<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Or du Temps</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' stroke='%23C9A84C' stroke-width='2' fill='%230A0806'/%3E%3Cpath d='M20 8 C14 14 10 20 20 26 C30 20 26 14 20 8Z' fill='%23C9A84C'/%3E%3Ccircle cx='20' cy='20' r='3' fill='%23C9A84C'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4A843;
            --gold-light: #F0CC74;
            --noir: #0A0806;
            --noir-3: #1A1310;
            --ivory: #F6F0E4;
            --ivory-dim: #C8BAA0;
            --glass-border: rgba(212,168,67,.2);
            --font-heading: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--noir);
            color: var(--ivory);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Radial glow background */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(212,168,67,.07) 0%, transparent 65%);
            pointer-events: none;
        }

        .page-wrap {
            position: relative; z-index: 1;
            max-width: 560px;
            animation: fade-up .9s .2s cubic-bezier(0.16,1,.3,1) both;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: .04em;
            margin-bottom: 3rem;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 25%;
        }

        .error-number {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 300;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(212,168,67,.3);
            letter-spacing: -.02em;
            margin-bottom: 1rem;
            user-select: none;
        }

        .error-eyebrow {
            font-size: .7rem;
            font-weight: 500;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 300;
            color: var(--ivory);
            line-height: 1.2;
            margin-bottom: 1.25rem;
        }

        h1 em {
            font-style: italic;
            color: var(--gold);
        }

        .error-desc {
            font-size: .97rem;
            color: var(--ivory-dim);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .85rem 2rem;
            font-family: var(--font-body);
            font-size: .88rem;
            font-weight: 500;
            letter-spacing: .06em;
            border-radius: 30px;
            text-decoration: none;
            transition: all .35s cubic-bezier(0.16,1,.3,1);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--noir);
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(201,168,76,.3);
        }

        .btn-ghost {
            background: transparent;
            color: var(--ivory);
            border: 1px solid rgba(245,240,232,.2);
        }
        .btn-ghost:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--glass-border);
            margin: 3rem auto;
        }

        .footer-note {
            font-size: .75rem;
            color: rgba(200,185,160,.35);
            letter-spacing: .1em;
        }

        /* Particles déco */
        .particles {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            animation: float-p linear infinite;
            opacity: .15;
        }
        @keyframes float-p {
            from { transform: translateY(100vh) scale(0); opacity: 0; }
            5%   { opacity: .25; }
            95%  { opacity: .1; }
            to   { transform: translateY(-20vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="page-wrap">
        <a href="index.html" class="logo" aria-label="Or du Temps — Retour à l'accueil">
            <img src="assets/logo.jpeg" alt="" aria-hidden="true" class="logo-img">
            Or du Temps
        </a>

        <p class="error-eyebrow">Erreur</p>
        <p class="error-number" aria-hidden="true">404</p>

        <h1>Cette page s'est<br>évaporée comme <em>la vapeur</em></h1>
        <p class="error-desc">
            La page que vous cherchez n'existe plus, a été déplacée,<br>
            ou n'a jamais existé. Rien de grave — retournez à l'accueil.
        </p>

        <div class="actions">
            <a href="index.html" class="btn btn-primary">
                ← Retour à l'accueil
            </a>
            <a href="index.html#contact" class="btn btn-ghost">
                Nous contacter
            </a>
        </div>

        <div class="divider"></div>
        <p class="footer-note">Or du Temps · Massage Bien-être · Albi &amp; Toulouse</p>
    </div>

    <script>
        // Particules flottantes (même effet que le hero)
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                const size = [1, 1.5, 2, 2.5][Math.floor(Math.random() * 4)];
                const dur = 14 + Math.random() * 18;
                p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${Math.random()*-dur}s;`;
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
