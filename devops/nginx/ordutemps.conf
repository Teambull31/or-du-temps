# ============================================================
#  Or du Temps — Virtual host Nginx
#  /etc/nginx/sites-available/ordutemps
#  Certbot ajoutera automatiquement le bloc HTTPS (443)
# ============================================================

# ── Rate limiting (zones partagées avec foodmatch) ──────────
# Si ces zones ne sont pas encore dans /etc/nginx/nginx.conf,
# décommente les deux lignes suivantes et mets-les dans le
# bloc http {} de /etc/nginx/nginx.conf :
#   limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name ordutemps.fr www.ordutemps.fr;

    # Certbot gèrera la redirection HTTP→HTTPS automatiquement

    root /var/www/ordutemps;
    index index.html;

    # ── Connexions et requêtes simultanées ───────────────────
    limit_conn conn_per_ip 15;
    limit_req  zone=req_per_ip burst=30 nodelay;

    # ── Timeouts défensifs ────────────────────────────────────
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;
    client_max_body_size  1m;

    # ── Bloquer requêtes sans Host header ────────────────────
    if ($host = "") { return 444; }

    # ── Bloquer bots/scanners connus ─────────────────────────
    if ($http_user_agent = "") { return 444; }
    if ($http_user_agent ~* "(masscan|zgrab|nmap|nikto|sqlmap|scrapy)") {
        return 444;
    }

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml font/woff2;
    gzip_min_length 1000;

    # ── En-têtes de sécurité ──────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com https://www.googletagmanager.com https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://www.google.com https://www.gstatic.com; frame-src https://calendly.com https://www.google.com; connect-src 'self' https://formspree.io https://www.google-analytics.com; object-src 'none';"
        always;

    # ── Cacher la version Nginx ───────────────────────────────
    server_tokens off;

    # ── Fichiers statiques — cache long ──────────────────────
    location ~* \.(css|js|woff2|woff|ttf|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Images — cache moyen ──────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── HTML — pas de cache (mises à jour immédiates) ────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options           "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options    "nosniff"                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # ── robots.txt et sitemap.xml ─────────────────────────────
    location = /robots.txt  { expires 1d; log_not_found off; }
    location = /sitemap.xml { expires 1d; }

    # ── admin (emma.html) — pas indexé, accès direct OK ──────
    location = /emma.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Page 404 personnalisée ────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ── API Node.js (Express sur port 3000) ──────────────────
    # Tout ce qui commence par /api/ est proxié vers le serveur
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        client_max_body_size  11m;  # légèrement > limit Express (10mb)
    }

    # ── Route /emma — panel admin (proxié vers Node.js) ──────
    location = /emma {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Route principale (fichiers statiques) ─────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
